<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Farm Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #888888;
            --accent-cyan: #25F4EE;
            --accent-red: #FE2C55;
            --border-radius: 12px;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; padding-bottom: 80px; }
        h2 { text-align: center; font-size: 24px; margin-bottom: 20px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .group-card { background-color: var(--card-bg); border-radius: var(--border-radius); margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-left: 4px solid var(--accent-cyan); transition: all 0.3s ease; }
        .group-header { padding: 15px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background-color: rgba(255,255,255,0.02); }
        .group-header::after { content: '▼'; font-size: 14px; color: var(--accent-cyan); transition: transform 0.3s; }
        .group-card.active .group-header::after { transform: rotate(-180deg); }
        .group-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 15px; }
        .group-card.active .group-content { max-height: 600px; padding: 10px 15px 20px 15px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-top: 12px; margin-bottom: 5px; text-transform: uppercase; }
        input[type="number"], input[type="text"], textarea { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: var(--text-color); font-size: 15px; box-sizing: border-box; outline: none; }
        textarea { resize: vertical; min-height: 70px; }
        .switch-wrapper { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; }
        .switch-label { font-size: 15px; margin: 0; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-cyan); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>

    <h2>Управление Сетью</h2>
    <div id="form-container"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        tg.MainButton.text = "СОХРАНИТЬ КОНФИГУРАЦИЮ";
        tg.MainButton.color = "#25F4EE";
        tg.MainButton.textColor = "#000000";
        tg.MainButton.show();

        const container = document.getElementById("form-container");

        for (let i = 1; i <= 5; i++) {
            container.innerHTML += `
                <div class="group-card" id="card_${i}">
                    <div class="group-header" onclick="toggleCard(${i})">📁 Группа ${i}</div>
                    <div class="group-content">
                        <label>Видео на аккаунт:</label>
                        <input type="number" id="vid_${i}" value="0">
                        
                        <label>Юзернеймы (через запятую):</label>
                        <textarea id="accs_${i}" placeholder="@account1, @account2..."></textarea>
                        
                        <label>Описание и хештеги:</label>
                        <textarea id="desc_${i}"></textarea>
                        
                        <div class="switch-wrapper">
                            <span class="switch-label">Авто-накрутка после поста</span>
                            <label class="switch">
                                <input type="checkbox" id="boost_${i}">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleCard(id) {
            document.getElementById(`card_${id}`).classList.toggle('active');
        }
        document.getElementById('card_1').classList.add('active');

        // ==========================================
        // МАГИЯ СИНХРОНИЗАЦИИ: Читаем данные от бота
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        if (dataParam) {
            try {
                const currentConfig = JSON.parse(decodeURIComponent(dataParam));
                for (let i = 1; i <= 5; i++) {
                    if (currentConfig[i]) {
                        document.getElementById(`vid_${i}`).value = currentConfig[i].videos || 0;
                        document.getElementById(`desc_${i}`).value = currentConfig[i].desc || "";
                        if (currentConfig[i].accounts) {
                            document.getElementById(`accs_${i}`).value = currentConfig[i].accounts.join(", ");
                        }
                        document.getElementById(`boost_${i}`).checked = currentConfig[i].auto_boost || false;
                    }
                }
            } catch (e) {
                console.error("Ошибка загрузки конфига:", e);
            }
        }

        // ==========================================
        // Сохранение и отправка обратно боту
        // ==========================================
        tg.MainButton.onClick(function() {
            let configData = {};
            for (let i = 1; i <= 5; i++) {
                let rawAccs = document.getElementById(`accs_${i}`).value;
                let accList = rawAccs.split(',').map(a => a.trim().replace('@', '')).filter(a => a.length > 0);
                configData[i.toString()] = {
                    "videos": parseInt(document.getElementById(`vid_${i}`).value) || 0,
                    "desc": document.getElementById(`desc_${i}`).value || "",
                    "accounts": accList,
                    "auto_boost": document.getElementById(`boost_${i}`).checked
                };
            }
            tg.sendData(JSON.stringify(configData));
            tg.close();
        });
    </script>
</body>
