<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Bot Control</title>
    <!-- Підключення бібліотеки Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; color: var(--tg-theme-button-color, #2481cc); }
        .group-card {
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input[type="number"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
        }
        textarea { resize: vertical; min-height: 60px; }
    </style>
</head>
<body>

    <h2>Управление Группами</h2>
    <div id="form-container"></div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо на весь екран

        const container = document.getElementById("form-container");

        // Генеруємо 5 карток для 5 груп
        for (let i = 1; i <= 5; i++) {
            container.innerHTML += `
                <div class="group-card">
                    <h3>📁 Группа ${i}</h3>
                    <label>Количество видео:</label>
                    <input type="number" id="vid_${i}" placeholder="Например: 4" value="0">
                    <label>Описание для видео (хештеги):</label>
                    <textarea id="desc_${i}" placeholder="Введи текст..."></textarea>
                </div>
            `;
        }

        // Показуємо головну кнопку Telegram "Сохранить"
        tg.MainButton.text = "СОХРАНИТЬ И ОТПРАВИТЬ БОТУ";
        tg.MainButton.show();

        // Обробник натискання на кнопку "Сохранить"
        tg.MainButton.onClick(function() {
            let configData = {};
            
            // Збираємо дані з усіх полів
            for (let i = 1; i <= 5; i++) {
                configData[i.toString()] = {
                    "videos": parseInt(document.getElementById(`vid_${i}`).value) || 0,
                    "desc": document.getElementById(`desc_${i}`).value || ""
                };
            }

            // Відправляємо сформований JSON назад у бота
            tg.sendData(JSON.stringify(configData));
        });
    </script>
</body>
</html>
