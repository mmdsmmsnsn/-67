<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Farm Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0f0f0f; --card-bg: #1e1e1e; --text-color: #ffffff; --text-muted: #888888; --accent-cyan: #25F4EE; --accent-red: #FE2C55; --border-radius: 12px; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; padding-bottom: 90px; }
        h2 { text-align: center; font-size: 24px; margin-bottom: 20px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .group-card { background-color: var(--card-bg); border-radius: var(--border-radius); margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-left: 4px solid var(--accent-cyan); transition: all 0.3s ease; }
        .group-header { padding: 15px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background-color: rgba(255,255,255,0.02); }
        .group-header::after { content: '▼'; font-size: 14px; color: var(--accent-cyan); transition: transform 0.3s; }
        .group-card.active .group-header::after { transform: rotate(-180deg); }
        .group-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 15px; }
        .group-card.active .group-content { max-height: 1200px; padding: 10px 15px 20px 15px; overflow-y: auto; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-top: 12px; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; background-color: #2a2a2a; border: 1px solid #333; border-radius: 8px; color: var(--text-color); font-size: 15px; box-sizing: border-box; outline: none; margin-bottom: 5px; }
        .my-save-btn { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--accent-cyan); color: #000; padding: 20px; font-size: 16px; font-weight: bold; text-align: center; border: none; cursor: pointer; z-index: 9999; text-transform: uppercase; }
        .task-row { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; position: relative; }
        .delete-btn { position: absolute; right: 10px; top: 10px; background: var(--accent-red); color: white; border: none; border-radius: 4px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer;}
        .add-btn { background: rgba(37, 244, 238, 0.2); color: var(--accent-cyan); border: 1px dashed var(--accent-cyan); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        .slot-container { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .slot-label { font-size: 11px; color: var(--accent-cyan); margin-bottom: 2px; margin-top: 8px; display: block; font-weight: bold; }
        .slot-input { margin-bottom: 0px; background-color: #222; }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-col { flex: 1; }
        
        .box-normal { background: rgba(37, 244, 238, 0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(37, 244, 238, 0.2); margin-top: 15px; margin-bottom: 15px;}
        .box-viral { background: rgba(254, 44, 85, 0.05); padding: 10px; border-radius: 8px; border: 1px solid rgba(254, 44, 85, 0.2); margin-top: 15px; margin-bottom: 15px;}
        .box-title { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body>

    <h2>Управление Сетью</h2>
    <div id="form-container"></div>
    
    <div class="group-card" id="card_scheduler" style="border-left-color: var(--accent-red);">
        <div class="group-header" onclick="toggleCard('scheduler')">⏰ ПЛАНИРОВЩИК ЗАДАЧ</div>
        <div class="group-content" id="scheduler-content">
            <div id="tasks-container"></div>
            <button class="add-btn" onclick="addTask()">➕ ДОБАВИТЬ ТАЙМЕР</button>
        </div>
    </div>

    <button class="my-save-btn" onclick="saveData()">СОХРАНИТЬ КОНФИГУРАЦИЮ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); 

        let tasks = [];
        let groupIds = [];

        function toggleCard(id) { document.getElementById(`card_${id}`).classList.toggle('active'); }

        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        const container = document.getElementById("form-container");
        
        if (dataParam) {
            try {
                const config = JSON.parse(decodeURIComponent(dataParam));
                
                for (let key in config) {
                    if (key !== "schedules" && !isNaN(key)) {
                        groupIds.push(key);
                        let grp = config[key];
                        grp.accounts = grp.accounts || []; 
                        
                        let apiLink = grp.api_link || "";
                        let themeVal = grp.theme || "dark";
                        
                        let vMin = grp.views_min || 400;
                        let vMax = grp.views_max || 500;
                        let lMin = grp.likes_min || 10;
                        let lMax = grp.likes_max || 15;
                        let sMin = grp.shares_min || 10;
                        let sMax = grp.shares_max || 15;
                        let sPerc = grp.shares_percent || 30;
                        
                        let vvWeek = grp.viral_per_week || 2;
                        let vvMin = grp.viral_views_min || 5000;
                        let vvMax = grp.viral_views_max || 10000;
                        let vlMin = grp.viral_likes_min || 150;
                        let vlMax = grp.viral_likes_max || 300;
                        let vsMin = grp.viral_shares_min || 50;
                        let vsMax = grp.viral_shares_max || 100;
                        
                        let accFields = "";
                        for(let i=0; i<5; i++) {
                            let globalAccNum = (parseInt(key) - 1) * 5 + (i + 1);
                            let accValue = grp.accounts[i] || '';
                            accFields += `
                                <span class="slot-label">Слот ${i+1} ➔ Папка: account_${globalAccNum}</span>
                                <input type="text" id="acc_${key}_${i}" class="slot-input" value="${accValue}" placeholder="@username" oninput="renderTasks()">
                            `;
                        }
                        
                        container.innerHTML += `
                            <div class="group-card" id="card_${key}">
                                <div class="group-header" onclick="toggleCard('${key}')">📁 Группа ${key}</div>
                                <div class="group-content">
                                    <label>Видео на акк:</label><input type="number" id="vid_${key}" value="${grp.videos || 0}">
                                    
                                    <label style="color: var(--accent-red);">Привязка аккаунтов к папкам:</label>
                                    <div class="slot-container">
                                        ${accFields}
                                    </div>
                                    
                                    <label>Ссылка на API накрутки:</label><input type="text" id="api_${key}" value="${apiLink}">
                                    
                                    <div class="box-normal">
                                        <h4 class="box-title" style="color: var(--accent-cyan);">📊 Обычные видео</h4>
                                        <div class="flex-row">
                                            <div class="flex-col"><label>👀 Просмотры (От)</label><input type="number" id="vmin_${key}" value="${vMin}"></div>
                                            <div class="flex-col"><label>👀 Просмотры (До)</label><input type="number" id="vmax_${key}" value="${vMax}"></div>
                                        </div>
                                        <div class="flex-row">
                                            <div class="flex-col"><label>❤️ Лайки (От)</label><input type="number" id="lmin_${key}" value="${lMin}"></div>
                                            <div class="flex-col"><label>❤️ Лайки (До)</label><input type="number" id="lmax_${key}" value="${lMax}"></div>
                                        </div>
                                        <div class="flex-row">
                                            <div class="flex-col"><label>🔁 Репосты (От)</label><input type="number" id="smin_${key}" value="${sMin}"></div>
                                            <div class="flex-col"><label>🔁 Репосты (До)</label><input type="number" id="smax_${key}" value="${sMax}"></div>
                                        </div>
                                        <label>🎯 Процент видео, получающих репосты (%):</label>
                                        <input type="number" id="sperc_${key}" value="${sPerc}">
                                    </div>
                                    
                                    <div class="box-viral">
                                        <h4 class="box-title" style="color: var(--accent-red);">🔥 Залетные видео (Вирусные)</h4>
                                        <label>Сколько залетных видео в неделю делать:</label>
                                        <input type="number" id="vvweek_${key}" value="${vvWeek}">
                                        
                                        <div class="flex-row">
                                            <div class="flex-col"><label>👀 Просмотры (От)</label><input type="number" id="vvmin_${key}" value="${vvMin}"></div>
                                            <div class="flex-col"><label>👀 Просмотры (До)</label><input type="number" id="vvmax_${key}" value="${vvMax}"></div>
                                        </div>
                                        <div class="flex-row">
                                            <div class="flex-col"><label>❤️ Лайки (От)</label><input type="number" id="vlmin_${key}" value="${vlMin}"></div>
                                            <div class="flex-col"><label>❤️ Лайки (До)</label><input type="number" id="vlmax_${key}" value="${vlMax}"></div>
                                        </div>
                                        <div class="flex-row">
                                            <div class="flex-col"><label>🔁 Репосты (От)</label><input type="number" id="vsmin_${key}" value="${vsMin}"></div>
                                            <div class="flex-col"><label>🔁 Репосты (До)</label><input type="number" id="vsmax_${key}" value="${vsMax}"></div>
                                        </div>
                                    </div>
                                    
                                    <label>Прокси (IP:PORT:LOG:PASS):</label>
                                    <input type="text" id="proxy_${key}" value="${grp.proxy || ''}" placeholder="Например: 185.10.10.1:8000:log:pass">
                                    
                                    <label>Ссылка для смены IP (Ротация):</label>
                                    <input type="text" id="rotate_${key}" value="${grp.rotate_link || ''}" placeholder="https://api.proxy-provider.com/change-ip...">
                                    
                                    <label>Тема скриншотов:</label>
                                    <select id="theme_${key}">
                                        <option value="dark" ${themeVal === 'dark' ? 'selected' : ''}>🌑 Темная</option>
                                        <option value="light" ${themeVal === 'light' ? 'selected' : ''}>🌕 Светлая</option>
                                    </select>
                                </div>
                            </div>`;
                    }
                }
                
                if(groupIds.length > 0) {
                    document.getElementById(`card_${groupIds[0]}`).classList.add('active');
                }
                
                if (config.schedules) { tasks = config.schedules; }
                renderTasks();
            } catch (e) { console.error(e); }
        }

        function renderTasks() {
            const cont = document.getElementById('tasks-container');
            cont.innerHTML = '';
            tasks.forEach((task, index) => {
                let dynamicUploadOptions = "";
                let dynamicAccountUploads = "";
                
                groupIds.forEach(id => {
                    dynamicUploadOptions += `<option value="upload_${id}" ${task.action === 'upload_'+id ? 'selected' : ''}>📁 Выкладка: Группа ${id}</option>`;
                    
                    for(let i=0; i<5; i++) {
                        let el = document.getElementById(`acc_${id}_${i}`);
                        if(el) {
                            let acc = el.value.trim().replace('@', '');
                            if(acc) {
                                let username = '@' + acc;
                                let val = `up1_${id}_${username}`;
                                dynamicAccountUploads += `<option value="${val}" ${task.action === val ? 'selected' : ''}>👤 Выкладка: ${username} (Гр ${id})</option>`;
                            }
                        }
                    }
                });

                cont.innerHTML += `
                    <div class="task-row" id="task_${index}">
                        <button class="delete-btn" onclick="deleteTask(${index})">УДАЛИТЬ</button>
                        <label>Что сделать:</label>
                        <select id="action_${index}" onchange="updateTask(${index}, 'action', this.value)">
                            <optgroup label="Массовые действия">
                                <option value="upload_all" ${task.action === 'upload_all' ? 'selected' : ''}>🧨 Запустить ВСЕ выкладки</option>
                                <option value="links" ${task.action === 'links' ? 'selected' : ''}>🔗 Собрать все ссылки</option>
                                <option value="order" ${task.action === 'order' ? 'selected' : ''}>🛒 Запустить всю накрутку</option>
                            </optgroup>
                            <optgroup label="Отдельные группы">
                                ${dynamicUploadOptions}
                            </optgroup>
                            <optgroup label="Отдельные аккаунты">
                                ${dynamicAccountUploads}
                            </optgroup>
                            <optgroup label="Дополнительно">
                                <option value="screens_all" ${task.action === 'screens_all' ? 'selected' : ''}>📸 Сделать все скриншоты</option>
                                <option value="stats" ${task.action === 'stats' ? 'selected' : ''}>📈 Собрать статистику</option>
                                <option value="sheets" ${task.action === 'sheets' ? 'selected' : ''}>📊 Обновить Google Таблицу</option>
                                <option value="sorter" ${task.action === 'sorter' ? 'selected' : ''}>🔄 Сортировка видео</option>
                            </optgroup>
                        </select>
                        <label>Частота:</label>
                        <select id="mode_${index}" onchange="changeMode(${index}, this.value)">
                            <option value="daily" ${task.mode === 'daily' ? 'selected' : ''}>🔁 Каждый день</option>
                            <option value="weekly" ${task.mode === 'weekly' ? 'selected' : ''}>📅 Раз в неделю</option>
                            <option value="once" ${task.mode === 'once' ? 'selected' : ''}>🎯 Единоразово</option>
                        </select>
                        
                        ${task.mode === 'weekly' ? `
                            <select id="day_${index}" onchange="updateTask(${index}, 'day', this.value)">
                                <option value="mon" ${task.day === 'mon' ? 'selected' : ''}>Понедельник</option>
                                <option value="tue" ${task.day === 'tue' ? 'selected' : ''}>Вторник</option>
                                <option value="wed" ${task.day === 'wed' ? 'selected' : ''}>Среда</option>
                                <option value="thu" ${task.day === 'thu' ? 'selected' : ''}>Четверг</option>
                                <option value="fri" ${task.day === 'fri' ? 'selected' : ''}>Пятница</option>
                                <option value="sat" ${task.day === 'sat' ? 'selected' : ''}>Суббота</option>
                                <option value="sun" ${task.day === 'sun' ? 'selected' : ''}>Воскресенье</option>
                            </select>
                        ` : ''}
                        
                        ${task.mode === 'once' ? `
                            <input type="date" id="date_${index}" value="${task.date || ''}" onchange="updateTask(${index}, 'date', this.value)">
                        ` : ''}
                        
                        <label>Время:</label>
                        <input type="time" id="time_${index}" value="${task.time || '12:00'}" onchange="updateTask(${index}, 'time', this.value)">
                    </div>`;
            });
        }

        function addTask() {
            tasks.push({ action: 'upload_all', mode: 'daily', time: '12:00', day: 'mon', date: '' });
            renderTasks();
        }
        function deleteTask(idx) { tasks.splice(idx, 1); renderTasks(); }
        function updateTask(idx, key, val) { tasks[idx][key] = val; }
        function changeMode(idx, newMode) { tasks[idx].mode = newMode; renderTasks(); }

        // 🔥 СУПЕР СЖАТИЕ ДАННЫХ ДЛЯ ОБХОДА ЛИМИТОВ TELEGRAM 🔥
        function saveData() {
            try {
                let payload = { "s": tasks, "g": {} };
                
                groupIds.forEach(id => {
                    let accs = [];
                    for(let i=0; i<5; i++) {
                        let el = document.getElementById(`acc_${id}_${i}`);
                        if(el) {
                            let val = el.value.trim().replace('@', '');
                            accs.push(val); 
                        }
                    }
                    while(accs.length > 0 && accs[accs.length - 1] === "") { accs.pop(); }

                    // Пакуем ВСЕ ключи в минимальный размер
                    payload.g[id] = {
                        "v": parseInt(document.getElementById(`vid_${id}`).value) || 0,
                        "a": accs,
                        "al": document.getElementById(`api_${id}`).value || "",
                        
                        "v1": parseInt(document.getElementById(`vmin_${id}`).value) || 0,
                        "v2": parseInt(document.getElementById(`vmax_${id}`).value) || 0,
                        "l1": parseInt(document.getElementById(`lmin_${id}`).value) || 0,
                        "l2": parseInt(document.getElementById(`lmax_${id}`).value) || 0,
                        "s1": parseInt(document.getElementById(`smin_${id}`).value) || 0,
                        "s2": parseInt(document.getElementById(`smax_${id}`).value) || 0,
                        "sp": parseInt(document.getElementById(`sperc_${id}`).value) || 0,
                        
                        "vw": parseInt(document.getElementById(`vvweek_${id}`).value) || 0,
                        "vv1": parseInt(document.getElementById(`vvmin_${id}`).value) || 0,
                        "vv2": parseInt(document.getElementById(`vvmax_${id}`).value) || 0,
                        "vl1": parseInt(document.getElementById(`vlmin_${id}`).value) || 0,
                        "vl2": parseInt(document.getElementById(`vlmax_${id}`).value) || 0,
                        "vs1": parseInt(document.getElementById(`vsmin_${id}`).value) || 0,
                        "vs2": parseInt(document.getElementById(`vsmax_${id}`).value) || 0,

                        "th": document.getElementById(`theme_${id}`).value || "dark",
                        "px": document.getElementById(`proxy_${id}`).value || "",
                        "rl": document.getElementById(`rotate_${id}`).value || ""
                    };
                });
                
                let jsonString = JSON.stringify(payload);
                tg.sendData(jsonString); // Стандартная отправка Телеграм
                
            } catch(e) {
                alert("Ошибка: " + e.message);
            }
        }
    </script>
</body>
</html>
